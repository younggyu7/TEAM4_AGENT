# Alembic 설정: 서비스 DB(PostgreSQL) 테이블 마이그레이션. backend/ 폴더에서 실행한다.
#   alembic upgrade head                       # 최신 테이블로 올리기
#   alembic revision --autogenerate -m "설명"  # app/models를 바꾼 뒤 마이그레이션 만들기
# DB 주소는 여기 적지 않고 .env의 DATABASE_URL을 쓴다 (alembic/env.py).

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
