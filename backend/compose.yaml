services:
  # 생성한 DDL을 적용해 보는 격리 PostgreSQL (서비스 데이터 저장용이 아님)
  validation-db:
    image: postgres:16
    environment:
      POSTGRES_USER: reqagent
      POSTGRES_PASSWORD: reqagent
      POSTGRES_DB: reqagent
    ports:
      - "55432:5432"

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      VALIDATION_DB_URL: postgresql://reqagent:reqagent@validation-db:5432/reqagent
    ports:
      - "8000:8000"
    volumes:
      - storage:/data
    depends_on:
      - validation-db

volumes:
  storage:
