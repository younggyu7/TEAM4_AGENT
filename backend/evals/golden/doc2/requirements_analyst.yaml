# requirements_analyst 튜닝용 정답지 — 고객요구사항2 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항2)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-10-28"
  inputs: ra_inputs.json (같은 폴더)
  split_from: requirements_analyst_docs12_v0.1.yaml (나누기 전 파일 이름)
  provenance: >-
    반자동 초안. 핵심 진술은 같은 폴더의 document_analyst.json 원문을 항목 기호 단위로 나눈 것이고,
    필수어(m)는 프로그램이 고름(문장의 숫자·조건 + 그 요구사항에서 드물게 나오는 낱말). 분류(t·s·c)는 요구사항별로 직접 정했고,
    시스템 기능을 새로 만들거나 바꾸는 문장(기능 추가·개선·구현 등)은 기능/시스템 해석도 인정함. 질문은 직접 작성.
    두 문서 모두 정보시스템 유지관리 사업이라 대부분이 수행업체 의무(PROJECT)다. 담당자 검수 필요.
  priority_policy: >-
    두 문서 모두 응락 수준 칸이 없다. '(필수)·반드시·필수적'이 있는 문장만 MUST, '권장'은 SHOULD, '(선택)'은 COULD.
    그 밖에는 p=null(원문에 근거 없음)이라 MUST로 확정하면 '근거 없는 우선순위'로 센다.
  revisions: []

