# requirements_analyst 튜닝용 정답지 (검수 전 초안, 버전은 meta.version)
#
# - 작성: AI가 원문(고객요구사항3·5)과 document_analyst 골든셋 v0.1을 보고 작성. 담당자 검수 전이다.
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 정답은 '요구사항 문장'이 아니라 '핵심 진술'이다. 분해 개수·표현이 달라도 핵심 진술의 필수어(m)가
#   한 요구사항(제목+설명+검수 기준)에 모두 들어 있으면 그 진술을 다룬 것으로 본다.
#
# 진술 필드
#   x: 핵심 진술 (사람이 읽는 정답)
#   m: 필수어. 공백·기호를 지우고 비교한다. 'a|b'는 둘 중 하나. 숫자·조건은 반드시 넣는다.
#   t: type    F=FUNCTIONAL, N=NON_FUNCTIONAL, FN=둘 다 인정
#   s: scope   S=SYSTEM, P=PROJECT(수행업체 의무), SP=둘 다 인정
#   c: category 인정 목록 (schemas.RequirementCategory)
#   p: priority. 생략하면 문서 기본값(default_priority). null = 원문에 근거 없음 → MUST 확정이면 감점
#   f: 금지어. 매칭된 요구사항에 들어 있으면 의미 왜곡 (예: '관리자에게만' → '모든 사용자')
#   note: 검수자 참고
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항5)
  version: "0.3"
  status: draft_pending_domain_review
  created_date: "2026-10-26"
  inputs: ra_inputs.json (같은 폴더)
  split_from: requirements_analyst_v0.3.yaml (나누기 전 파일 이름)
  provenance: AI 초안. 원문 표의 문장을 기준으로 핵심 진술을 뽑음. 분류(t·s·c)는 애매하면 둘 다 인정으로 표시함.
  revisions:
    - "v0.1 → v0.2 (2026-10-26, 첫 실행 결과를 보고 정답지 원칙을 바로잡음. 모델 출력에 맞춘 것이 아니라 '분해 개수가 달라도 인정' 원칙 적용):
       서로 독립된 항목을 한 진술로 묶었던 PDF5 ECR-001#7(모니터링·자동 복구), DAR-001#4(PDF 다운로드·법정 양식)를 둘로 나눔.
       PDF5 COR-001#4는 법 이름 대신 내용(불법 접근 차단)도 인정. 질문에 blocking 허용 주제(blocking_ok) 추가,
       불필요 질문은 '값 자체를 묻는' 경우로 좁힘.
       PDF5 MHR-001#3의 p: MUST 삭제 ('투입하여야 함'은 의무 어미뿐이라 priority_policy상 근거 없음 → 정답지 자체 오류)."
    - "v0.2 → v0.3 (2026-10-27, 원본 RFP 대조 결과 반영): 원문 세부내용 중 정답지가 확인하지 않던 요구 내용 37개를 진술로 추가
       (정비 기준표 수치, 예외·조건 문장 포함). 하위 항목 여러 개를 한 단어로만 확인하던 진술과 일반 단어 한 개뿐인 필수어
       40곳에 필수어를 더해 구체화 (예: [백업] → [백업, 복구]). 정의 문단·참고(※·예시) 문장은 제외."
  priority_policy: >-
    원문에 응락 수준(필수·권장·선택)이 있으면 그대로 따른다 (필수→MUST, 권장→SHOULD, 선택→COULD).
    응락 수준이 없으면 문장 표현만 근거로 삼는다 ('권장'→SHOULD, '필수적으로·반드시'→MUST).
    표현도 없으면 MUST를 확정하지 않는다(정답 p=null). 확정했다면 '근거 없는 우선순위'로 센다.

