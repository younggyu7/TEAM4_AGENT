# requirements_analyst 튜닝용 정답지 — 고객요구사항8 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항8)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-11-02"
  inputs: ra_inputs.json (같은 폴더)
  provenance: >-
    반자동 초안 (doc1·doc2·doc6·doc7과 같은 규칙). 기능 요구사항의 핵심 진술은 같은 폴더 document_analyst.json의 원문을 'ㅇ' 항목 단위로,
    비기능 요구사항(한 칸에 쉼표로 나열)은 쉼표 단위로 나눈 것이고, 필수어(m)는 프로그램이 고름(단위가 붙은 숫자 + 그 요구사항에서 드물게 나오는 명사).
    기능 요구사항은 기본 기능/시스템/기능이고 문장 낱말로 다른 해석도 인정(연동·API→인터페이스, 권한·암호·마스킹→보안, 엑셀·DB·이관→데이터,
    응답시간·동기화→성능, 반응형·접근성→품질, '착수 시 현행'·구조 설계→수행업체 의무). 비기능은 분류별로 직접 정함.
    고정 입력에 있는 35개 단위만 다룸: 이 날 파서가 다음 쪽으로 이어진 비기능 요구사항 30개를 추출 단위로 만들지 못함. 담당자 검수 필요.
  priority_policy: >-
    응락 수준 칸이 없다. '(필수)·반드시·필수적'이 있는 문장만 MUST, '권장'은 SHOULD, '(선택)'은 COULD.
    그 밖에는 p=null(원문에 근거 없음)이라 MUST로 확정하면 '근거 없는 우선순위'로 센다.
  revisions: []

