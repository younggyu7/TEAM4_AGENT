# requirements_analyst 튜닝용 정답지 — 고객요구사항7 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항7)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-11-02"
  inputs: ra_inputs.json (같은 폴더)
  provenance: >-
    반자동 초안 (doc1·doc2·doc6과 같은 규칙). 핵심 진술은 같은 폴더 document_analyst.json의 원문(받은 원본 PDF 6~16쪽)을 항목 기호 단위로 나눈 것이고,
    필수어(m)는 프로그램이 고름(단위가 붙은 숫자 + 그 요구사항에서 드물게 나오는 명사). 분류(t·s·c)는 요구사항별로 직접 정함.
    장비 도입 사업이라 ECR은 장비 규격(시스템), PER-001~004는 분류가 성능이지만 내용이 AGV 안전 동작·S/W 기능 목록이라 기능 해석도 인정.
    ECR-001 안의 시스템 구성 목록(입출고 관리·연동)은 기능, 교육·기술지원·제출·교체는 수행업체 의무로 나눔.
    고정 입력에서 PER-003의 다음 쪽 8줄이 PER-004 단위에 붙어 있어, 그 줄의 진술은 PER-003 정답에서 빠짐(PER-004에서 나오면 '정답에 없는 요구사항'으로 셈). 담당자 검수 필요.
  priority_policy: >-
    모든 요구사항 표에 응락수준 '필수'가 있다. 코드가 응락 수준을 그대로 따르므로 정답 우선순위는 모두 MUST.
  revisions: []

