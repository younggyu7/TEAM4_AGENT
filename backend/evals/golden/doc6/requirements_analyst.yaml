# requirements_analyst 튜닝용 정답지 — 고객요구사항6 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항6)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-10-28"
  inputs: ra_inputs.json (같은 폴더)
  provenance: >-
    반자동 초안 (doc1·doc2와 같은 규칙). 핵심 진술은 같은 폴더 document_analyst.json의 원문(원본 엑셀 셀)을 항목 기호 단위로 나눈 것이고,
    필수어(m)는 프로그램이 고름(단위가 붙은 숫자 + 그 요구사항에서 드물게 나오는 명사).
    분류는 구축할 시스템의 기능 목록이라 기본을 기능/시스템/기능으로 두고, 문장 낱말로 다른 해석도 인정함
    (연계·연동→인터페이스, 암호화·비밀번호·권한·로그인→보안, 브라우저·모바일→품질·장비구성, 엑셀·출력→데이터,
    '공사에 관련 보고·공사와 협의'→수행업체 의무). 담당자 검수 필요.
    SFT-068의 마지막 3줄은 PDF에서 다른 표가 겹쳐 있어 입력 글자가 섞여 있다. 정답에는 원본 문장으로 둔다.
  priority_policy: >-
    응락 수준 칸이 없다. '(필수)·반드시·필수적'이 있는 문장만 MUST, '권장'은 SHOULD, '(선택)'은 COULD.
    그 밖에는 p=null(원문에 근거 없음)이라 MUST로 확정하면 '근거 없는 우선순위'로 센다.
  revisions: []

