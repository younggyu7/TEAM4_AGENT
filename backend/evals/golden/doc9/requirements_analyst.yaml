# requirements_analyst 튜닝용 정답지 — 고객요구사항9 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다.
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항9)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-11-02"
  inputs: ra_inputs.json (같은 폴더)
  provenance: >-
    반자동 초안 (doc1·doc2·doc6~8과 같은 필수어 규칙). DOCX로 바뀌며 항목 기호(○)가 사라져 핵심 진술은 같은 폴더 document_analyst.json의 원문을
    줄 단위로 나눈 것이고(정의·산출정보·짧은 줄 제외), 필수어(m)는 프로그램이 고름(단위가 붙은 숫자 + 그 요구사항에서 드물게 나오는 명사).
    분류는 번호 접두어별 기본값(ECR 장비구성, PER 성능, SIR 인터페이스·품질, DAR 데이터, TER 테스트, SER 보안, QUR 품질, COR 제약, PMR 사업관리, PSR 사업지원)이고,
    기능 요구사항은 기본 기능/시스템에 문장 낱말로 다른 해석도 인정(연계·API→인터페이스, 권한·보안→보안, 데이터·통계→데이터, 실시간·성능→성능, 모바일·화면·UI→품질).
    고정 입력에 없는 줄(파서가 놓친 조각 표·글상자 내용)의 진술은 뺌. 담당자 검수 필요.
  priority_policy: >-
    응락 수준 칸이 없다. '(필수)·반드시·필수적'이 있는 문장만 MUST, '권장'은 SHOULD, '(선택)'은 COULD.
    그 밖에는 p=null(원문에 근거 없음)이라 MUST로 확정하면 '근거 없는 우선순위'로 센다.
  revisions: []

