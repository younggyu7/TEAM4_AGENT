# requirements_analyst 튜닝용 정답지 — 고객요구사항12 (검수 전 초안)
#
# - 입력: 같은 폴더의 ra_inputs.json (추출 단위 고정). 키는 그 파일의 source_key다 (이 문서는 목차 묶음 C01~C11).
# - 필드 뜻은 doc3/requirements_analyst.yaml과 같다. 진술 앞의 [MSR-001] 같은 표시는 원래 요구사항 번호다.
meta:
  name: requirements_analyst 튜닝용 정답지 (고객요구사항12)
  version: "0.1"
  status: draft_pending_domain_review
  created_date: "2026-11-03"
  inputs: ra_inputs.json (같은 폴더)
  provenance: >-
    반자동 초안 (doc1·doc2·doc6~9와 같은 규칙). 핵심 진술은 같은 폴더 document_analyst.json의 원문(받은 원본 PDF 글자)을 항목 기호 단위로 나눈 것이고,
    필수어(m)는 프로그램이 고름(단위가 붙은 숫자 + 그 요구사항에서 드물게 나오는 명사). 진술은 그 글자가 든 목차 묶음(C01~C11)에 담음.
    이 날 파서가 요구사항 표를 알아보지 못해 추출 단위가 목차 묶음이기 때문이다. 글상자에 든 표(MSR-001·PMR-001)의 진술은 입력에 없어 뺌.
    전산장비 유지보수 용역이라 대부분 수행업체 의무(PROJECT)이고, 분류는 번호 접두어별로 정함(MSR 사업지원, MHR·PMR 사업관리, SER 보안, RER 제약, PSR 사업지원). 담당자 검수 필요.
  priority_policy: >-
    응락 수준 칸이 없다. '(필수)·반드시·필수적'이 있는 문장만 MUST, '권장'은 SHOULD, '(선택)'은 COULD.
    그 밖에는 p=null(원문에 근거 없음)이라 MUST로 확정하면 '근거 없는 우선순위'로 센다.
  revisions: []

